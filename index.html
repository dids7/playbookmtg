  return { resultado: null, mulligan: 0, playDraw: null };

function emptyForm() {
  return {

    tipo: "treino", local: "", data: todayISO(), rodada: "", colocacao: "", nota: "", torneioId: "", tagsDerrota: [],
    isBye: false,
  };
}
function matchOutcome(games) {
  let pontosA = 0, pontosB = 0;
  for (const g of games) {
    if (!g.resultado) break;
    if (g.resultado === "vitoria") pontosA += 1;
    else if (g.resultado === "derrota") pontosB += 1;
    else if (g.resultado === "empate") { pontosA += 1; pontosB += 1; }

    if (g.resultado === "empate") {
      // Um empate de jogo (tempo esgotado) encerra a partida ali mesmo, sem precisar dos jogos seguintes.
      if (pontosA > pontosB) return { outcome: "vitoria", score: `${pontosA}-${pontosB}` };
      if (pontosB > pontosA) return { outcome: "derrota", score: `${pontosA}-${pontosB}` };
      return { outcome: "empate", score: `${pontosA}-${pontosB}` };
    }
    if (pontosA >= 2) return { outcome: "vitoria", score: `${pontosA}-${pontosB}` };
    if (pontosB >= 2) return { outcome: "derrota", score: `${pontosA}-${pontosB}` };
  }
  return { outcome: null, score: `${pontosA}-${pontosB}` };
}
function needsGame3(games) {
  const g1 = games[0], g2 = games[1];
  if (!g1.resultado || !g2.resultado) return false;
  if (g1.resultado === "empate" || g2.resultado === "empate") return false;
  const wins = [g1, g2].filter((g) => g.resultado === "vitoria").length;
  const losses = [g1, g2].filter((g) => g.resultado === "derrota").length;
  return wins < 2 && losses < 2;
}

  if (wr >= 60) return "#4B6B4E";

function generateInviteCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sem caracteres ambíguos (0/O, 1/I)
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

const TEAM_MAX_MEMBERS = 10;

async function createTeam(uidStr, teamName, displayName) {
  const { db, doc, collection, setDoc, arrayUnion } = window.__fb;
  const inviteCode = generateInviteCode();
  const teamRef = doc(collection(db, "teams"));
  await setDoc(teamRef, { name: teamName, inviteCode, ownerUid: uidStr, createdAt: Date.now(), memberCount: 1 });
  await setDoc(doc(db, "users", uidStr), { teamIds: arrayUnion(teamRef.id), activeTeamId: teamRef.id }, { merge: true });
  await setDoc(doc(db, "teams", teamRef.id, "members", uidStr), { displayName: displayName || "Jogador", joinedAt: Date.now() });
  return { teamId: teamRef.id, inviteCode, ownerUid: uidStr };
}

async function joinTeamByCode(uidStr, code, displayName) {
  const { db, collection, query, where, getDocs, doc, setDoc, updateDoc, increment, arrayUnion } = window.__fb;
  const normalized = code.trim().toUpperCase();
  const q = query(collection(db, "teams"), where("inviteCode", "==", normalized));
  const snap = await getDocs(q);
  if (snap.empty) throw new Error("Código não encontrado. Confere se digitou certo.");
  const teamDoc = snap.docs[0];
  const teamData = teamDoc.data();
  const currentCount = typeof teamData.memberCount === "number" ? teamData.memberCount : 0;
  if (currentCount >= TEAM_MAX_MEMBERS) {
    throw new Error(`Esse time já está com todas as ${TEAM_MAX_MEMBERS} vagas preenchidas.`);
  }
  await setDoc(doc(db, "users", uidStr), { teamIds: arrayUnion(teamDoc.id), activeTeamId: teamDoc.id }, { merge: true });
  await updateDoc(doc(db, "teams", teamDoc.id), { memberCount: increment(1) });
  await setDoc(doc(db, "teams", teamDoc.id, "members", uidStr), { displayName: displayName || "Jogador", joinedAt: Date.now() });
  return { teamId: teamDoc.id, teamName: teamData.name, inviteCode: teamData.inviteCode, ownerUid: teamData.ownerUid };
}

// Carrega todos os times do usuário, migrando contas antigas (campo teamId único) automaticamente
async function loadUserTeamsInfo(uidStr) {
  const { db, doc, getDoc, setDoc } = window.__fb;
  const userRef = doc(db, "users", uidStr);
  const userSnap = await getDoc(userRef);
  if (!userSnap.exists()) return { teams: [], activeTeamId: null };

  const d = userSnap.data();
  let teamIds = d.teamIds;
  let activeTeamId = d.activeTeamId;

  if (!teamIds && d.teamId) {
    teamIds = [d.teamId];
    activeTeamId = d.teamId;
    await setDoc(userRef, { teamIds, activeTeamId }, { merge: true });
  }
  teamIds = teamIds || [];

  const teams = [];
  for (const tid of teamIds) {
    const tSnap = await getDoc(doc(db, "teams", tid));
    if (tSnap.exists()) teams.push({ teamId: tid, name: tSnap.data().name, inviteCode: tSnap.data().inviteCode, ownerUid: tSnap.data().ownerUid });
  }
  if (!activeTeamId && teams.length > 0) activeTeamId = teams[0].teamId;
  return { teams, activeTeamId };
}

async function seedDefaultDecksIfNeeded(teamId, decks) {

  let changed = false;
  for (const [formato, list] of Object.entries(DEFAULT_DECKS_BY_FORMATO)) {

    if (hasAny) continue;
    newDecks = [...newDecks, ...list.map((name) => ({ name, formato }))];
    changed = true;
  }
  if (!changed) return;
  const ref = doc(db, "teams", teamId, "data", "catalog");
  try {
    await setDoc(ref, { decks: newDecks }, { merge: true });
  } catch (e) {
    console.error("Erro ao popular decks padrão:", e);

}

function parseEventImportText(text) {
  const validCategorias = Object.keys(EVENT_CATEGORIAS);
  const lines = text.split(/\r?\n/);
  const eventos = [];
  const erros = [];
  lines.forEach((rawLine, i) => {
    const line = rawLine.trim();
    if (!line || line.startsWith("//") || line.startsWith("#")) return;
    const parts = line.split("|").map((p) => p.trim());
    if (parts.length < 5) { erros.push(`Linha ${i + 1}: precisa de 5 campos separados por "|" (título | categoria | local | região | datas).`); return; }
    const [titulo, categoria, local, regiao, datasStr] = parts;
    if (!titulo) { erros.push(`Linha ${i + 1}: título vazio.`); return; }
    if (!validCategorias.includes(categoria)) { erros.push(`Linha ${i + 1}: categoria "${categoria}" inválida (use ${validCategorias.join(", ")}).`); return; }
    const dates = datasStr.split(",").map((d) => d.trim()).filter(Boolean).map((d) => {
      const m = d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!m) return null;
      return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    });
    if (dates.length === 0 || dates.some((d) => !d)) { erros.push(`Linha ${i + 1}: datas inválidas (use dd/mm/aaaa separadas por vírgula).`); return; }
    eventos.push({ titulo, categoria, local, regiao, dates });
  });
  return { eventos, erros };
}

function escapeHtml(str) {
  return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderSimpleMarkdown(text) {
  const lines = String(text || "").split(/\r?\n/);
  const htmlParts = [];
  let listBuffer = [];
  function flushList() {
    if (listBuffer.length) {
      htmlParts.push('<ul style="margin:4px 0 8px 18px;padding:0;">' + listBuffer.map((li) => `<li>${li}</li>`).join("") + "</ul>");
      listBuffer = [];
    }
  }
  lines.forEach((raw) => {
    let line = escapeHtml(raw);
    line = line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    line = line.replace(/\*(.+?)\*/g, "<em>$1</em>");
    if (/^#{1,3}\s+/.test(line)) {
      flushList();
      const level = line.match(/^#{1,3}/)[0].length;
      const content = line.replace(/^#{1,3}\s+/, "");
      const size = level === 1 ? 18 : level === 2 ? 16 : 14;
      htmlParts.push(`<div style="font-weight:700;font-size:${size}px;margin:8px 0 4px;">${content}</div>`);
    } else if (/^-\s+/.test(line)) {
      listBuffer.push(line.replace(/^-\s+/, ""));
    } else if (line.trim() === "") {
      flushList();
      htmlParts.push('<div style="height:6px;"></div>');
    } else {
      flushList();
      htmlParts.push(`<div style="margin:2px 0;">${line}</div>`);
    }
  });
  flushList();
  return htmlParts.join("");
}
async function loadTeamBackupData(teamId) {
  const { db, doc, getDoc, collection, getDocs } = window.__fb;

  const teamSnap = await getDoc(doc(db, "teams", teamId));
  const teamInfo = teamSnap.exists() ? teamSnap.data() : null;

  const catalogSnap = await getDoc(doc(db, "teams", teamId, "data", "catalog"));
  const catalog = catalogSnap.exists() ? catalogSnap.data() : { decks: [], lojas: [] };

  const membersSnap = await getDocs(collection(db, "teams", teamId, "members"));
  const members = {};
  membersSnap.forEach((d) => { members[d.id] = d.data(); });

  const playersSnap = await getDocs(collection(db, "teams", teamId, "players"));
  const players = {};
  playersSnap.forEach((d) => { players[d.id] = d.data(); });

  const allMatchesSnap = await getDocs(collection(db, "teams", teamId, "allMatches"));
  const allMatches = {};
  allMatchesSnap.forEach((d) => { allMatches[d.id] = d.data(); });

  // Junta os UIDs conhecidos de todas as fontes, pra não deixar ninguém de fora
  // mesmo em times criados antes da coleção "members" existir.
  const uids = new Set([...Object.keys(members), ...Object.keys(players), ...Object.keys(allMatches)]);

  const jogadores = [];
  for (const uid of uids) {
    const mirror = allMatches[uid] || {};
    jogadores.push({
      uid,
      displayName: (members[uid] && members[uid].displayName) || mirror.displayName || "Jogador",
      matches: mirror.matches || [],
      ownedDecks: mirror.ownedDecks || [],
      sideboards: mirror.sideboards || [],
      activeTournament: mirror.activeTournament || null,
    });
  }

  return {
    geradoEm: new Date().toISOString(),
    time: { id: teamId, nome: teamInfo ? teamInfo.name : "", inviteCode: teamInfo ? teamInfo.inviteCode : "", ownerUid: teamInfo ? teamInfo.ownerUid : "" },
    catalogo: { decks: catalog.decks || [], lojas: catalog.lojas || [] },
    jogadores,
  };
}
function subscribeVisiblePlayers(teamId, myUid, callback) {
  const { db, collection, query, where, onSnapshot } = window.__fb;
  const q = query(collection(db, "teams", teamId, "players"), where("visible", "==", true));
  return onSnapshot(q, (snap) => {
    const list = [];
    snap.forEach((docSnap) => {
      if (docSnap.id === myUid) return;
      const d = docSnap.data();
      list.push({ uid: docSnap.id, displayName: d.displayName || "Jogador", matches: d.matches || [] });
    });
    callback(list);
  }, (err) => {
    console.error("Erro ao sincronizar lista de jogadores:", err);
  });
}
// Wilson Score (limite inferior, 95% de confiança) — usado pra ranquear justamente
// levando em conta o tamanho da amostra, não só a porcentagem bruta de vitórias.
function parseDecklistTxt(text) {
  const rawLines = text.split(/\r?\n/);
  const mainboard = [];
  const sideboard = [];
  let inSideboard = false;
  let sawExplicitMarker = false;
  const cardLineRe = /^(\d+)\s*x?\s+(.+)$/i;
  const sbPrefixRe = /^SB:?\s*(\d+)\s*x?\s+(.+)$/i;

  // Descobre se existe um bloco de linhas em branco separando maindeck de sideboard,
  // pra usar como fallback quando não houver marcador explícito ("Sideboard" ou "SB:").
  let lastBlankBeforeCards = -1;
  rawLines.forEach((rawLine, i) => {
    const line = rawLine.trim();
    if (!line && i > 0 && i < rawLines.length - 1) {
      const hasMoreCardsAfter = rawLines.slice(i + 1).some((l) => cardLineRe.test(l.trim()));
      const hadCardsBefore = rawLines.slice(0, i).some((l) => cardLineRe.test(l.trim()));
      if (hasMoreCardsAfter && hadCardsBefore) lastBlankBeforeCards = i;
    }
  });

  rawLines.forEach((rawLine, i) => {
    const line = rawLine.trim();
    if (!line) return;
    if (/^sideboard\b/i.test(line)) { inSideboard = true; sawExplicitMarker = true; return; }
    if (/^deck(list)?\b/i.test(line) && !cardLineRe.test(line)) return;
    if (line.startsWith("//") || line.startsWith("#")) return;

    const sbMatch = line.match(sbPrefixRe);
    if (sbMatch) {
      sawExplicitMarker = true;
      const qty = parseInt(sbMatch[1], 10);
      const name = sbMatch[2].trim().split(" (")[0].trim();
      if (qty && name) sideboard.push({ name, qty });
      return;
    }

    const match = line.match(cardLineRe);
    if (!match) return;
    const qty = parseInt(match[1], 10);
    let name = match[2].trim().split(" (")[0].trim();
    if (!qty || !name) return;

    const goesToSideboard = inSideboard || (!sawExplicitMarker && lastBlankBeforeCards !== -1 && i > lastBlankBeforeCards);
    (goesToSideboard ? sideboard : mainboard).push({ name, qty });
  });
  return { mainboard, sideboard };
}
async function fetchCardImages(cardNames) {
  const imageByName = {};
  const notFound = [];
  const chunks = [];
  for (let i = 0; i < cardNames.length; i += 75) chunks.push(cardNames.slice(i, i + 75));
  for (const chunk of chunks) {
    try {
      const res = await fetch("https://api.scryfall.com/cards/collection", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifiers: chunk.map((name) => ({ name })) }),
      });
      const data = await res.json();
      (data.data || []).forEach((card) => {
        const img = card.image_uris ? card.image_uris.normal
          : (card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris ? card.card_faces[0].image_uris.normal : null);
        if (img) imageByName[card.name.toLowerCase()] = img;
      });
      (data.not_found || []).forEach((nf) => notFound.push(nf.name));
    } catch (e) {
      chunk.forEach((name) => notFound.push(name));
    }
  }
  return { imageByName, notFound };
}
function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}
function expandCardList(entries) {
  const out = [];
  entries.forEach((c) => {
    for (let i = 0; i < c.qty; i++) out.push({ name: c.name, imageUrl: c.imageUrl || null });
  });
  return out;
}
function wilsonScore(wins, total) {
  if (total === 0) return 0;
  const p = wins / total;
  const z = 1.96;
  const n = total;
  const denominator = 1 + (z * z) / n;
  const term1 = p + (z * z) / (2 * n);
  const term2 = z * Math.sqrt((p * (1 - p) + (z * z) / (4 * n)) / n);
  return (term1 - term2) / denominator;
}
// % baseado em pontos de torneio (Vitória=3, Empate=1, Derrota=0), sobre o máximo possível (total*3).
function winPct(wins, draws, total) {
  if (!total) return 0;
  return Math.round(((wins * 3 + (draws || 0)) / (total * 3)) * 100);
}
// "Vitórias equivalentes" pra alimentar o Wilson Score (empate conta 1/3 de vitória).
function effectiveWins(wins, draws) {
  return wins + (draws || 0) / 3;
}

function computeMatchStats(matches) {
  const total = matches.length;
  const wins = matches.filter((m) => m.resultado === "vitoria").length;
  const losses = matches.filter((m) => m.resultado === "derrota").length;
  const draws = matches.filter((m) => m.resultado === "empate").length;
  const byeCount = matches.filter((m) => m.isBye).length;
  const winRate = winPct(wins, draws, total);
  const byOpp = {};
  matches.filter((m) => !m.isBye).forEach((m) => {
    byOpp[m.oponenteDeck] = byOpp[m.oponenteDeck] || { total: 0, wins: 0, losses: 0 };
    byOpp[m.oponenteDeck].total += 1;
    if (m.resultado === "vitoria") byOpp[m.oponenteDeck].wins += 1;
    else if (m.resultado === "derrota") byOpp[m.oponenteDeck].losses += 1;
  });
  const chartData = Object.entries(byOpp)
    .map(([opp, v]) => ({ name: opp, total: v.total, wins: v.wins, losses: v.losses, winRate: winPct(v.wins, v.total - v.wins - v.losses, v.total) }))
    .sort((a, b) => b.total - a.total);
  return { total, wins, losses, draws, byeCount, winRate, chartData };
}
function deckKey(formato, name) { return formato + "||" + name; }

const MONTH_NAMES_PT = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const LOSS_TAGS = ["Mana screw", "Mana flood", "Misplay", "Sideboard errado", "Mulligan ruim", "Deck do oponente mais forte", "Topdeck do oponente", "Outro"];
function monthKey(dateStr) { return dateStr.slice(0, 7); } // "2026-07"
function monthLabel(key) {
  const [y, m] = key.split("-");
  return `${MONTH_NAMES_PT[parseInt(m, 10) - 1]} de ${y}`;
}
function prevMonthKey(key) {
  const [y, m] = key.split("-").map((n) => parseInt(n, 10));
  const d = new Date(y, m - 2, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function weekStartLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const diffToMonday = (day + 6) % 7;
  d.setDate(d.getDate() - diffToMonday);
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function computeReportStats(matches) {
  const total = matches.length;
  const wins = matches.filter((m) => m.resultado === "vitoria").length;
  const losses = matches.filter((m) => m.resultado === "derrota").length;
  const byeCount = matches.filter((m) => m.isBye).length;
  const winRate = winPct(wins, total - wins - losses, total);

  const byTipo = (tipo) => {
    const list = matches.filter((m) => m.tipo === tipo);
    const w = list.filter((m) => m.resultado === "vitoria").length;
    const l = list.filter((m) => m.resultado === "derrota").length;
    return { total: list.length, wins: w, winRate: winPct(w, list.length - w - l, list.length) };
  };
  const torneio = byTipo("torneio");
  const treino = byTipo("treino");

  const allGames = matches.flatMap((m) => m.games || []);
  const byPlayDraw = (pd) => {
    const list = allGames.filter((g) => g.playDraw === pd);
    const w = list.filter((g) => g.resultado === "vitoria").length;
    const l = list.filter((g) => g.resultado === "derrota").length;
    return { total: list.length, wins: w, winRate: winPct(w, list.length - w - l, list.length) };
  };
  const play = byPlayDraw("play");
  const draw = byPlayDraw("draw");

  const byOpp = {};
  matches.filter((m) => !m.isBye).forEach((m) => {
    byOpp[m.oponenteDeck] = byOpp[m.oponenteDeck] || { total: 0, wins: 0, losses: 0 };
    byOpp[m.oponenteDeck].total += 1;
    if (m.resultado === "vitoria") byOpp[m.oponenteDeck].wins += 1;
    else if (m.resultado === "derrota") byOpp[m.oponenteDeck].losses += 1;
  });
  const matchupStats = Object.entries(byOpp).map(([opp, v]) => {
    const oppMatches = matches.filter((m) => m.oponenteDeck === opp);
    const g1Games = oppMatches.map((m) => m.games && m.games[0]).filter(Boolean);
    const postBoardGames = oppMatches.flatMap((m) => (m.games || []).slice(1));
    const g1Wins = g1Games.filter((g) => g.resultado === "vitoria").length;
    const g1Losses = g1Games.filter((g) => g.resultado === "derrota").length;
    const postWins = postBoardGames.filter((g) => g.resultado === "vitoria").length;
    const postLosses = postBoardGames.filter((g) => g.resultado === "derrota").length;
    const sampleLabel = v.total < 3 ? "amostra pequena" : v.total < 7 ? "amostra média" : "amostra boa";
    return {
      opp, total: v.total, wins: v.wins, losses: v.losses, winRate: winPct(v.wins, v.total - v.wins - v.losses, v.total),
      g1WinRate: g1Games.length ? winPct(g1Wins, g1Games.length - g1Wins - g1Losses, g1Games.length) : null,
      postBoardWinRate: postBoardGames.length ? winPct(postWins, postBoardGames.length - postWins - postLosses, postBoardGames.length) : null,
      sampleLabel,
    };
  }).sort((a, b) => b.total - a.total);

  const bestMatchup = [...matchupStats].filter((m) => m.total >= 2).sort((a, b) => b.winRate - a.winRate)[0] || null;
  const worstMatchups = [...matchupStats].filter((m) => m.total >= 2).sort((a, b) => a.winRate - b.winRate).slice(0, 3);

  const mirrorMatches = matches.filter((m) => m.meuDeck === m.oponenteDeck);
  const mirrorWins = mirrorMatches.filter((m) => m.resultado === "vitoria").length;

  const wonG1LostMatch = matches.filter((m) => m.games && m.games[0] && m.games[0].resultado === "vitoria" && m.resultado === "derrota");

  const lossNotes = matches.filter((m) => m.resultado === "derrota" && m.nota && m.nota.trim());

  const totalLosses = matches.filter((m) => m.resultado === "derrota").length;
  const lossesWithMulligan = matches.filter((m) => m.resultado === "derrota" && m.games && m.games.some((g) => g.mulligan > 0)).length;

  const gamesWithMulligan = allGames.filter((g) => g.mulligan > 0);
  const gamesNoMulligan = allGames.filter((g) => g.mulligan === 0);
  const mullWinRate = (list) => {
    const w = list.filter((g) => g.resultado === "vitoria").length;
    const l = list.filter((g) => g.resultado === "derrota").length;
    return winPct(w, list.length - w - l, list.length);
  };

  const mullByCount = [0, 1, 2].map((n) => {
    const list = n === 2 ? allGames.filter((g) => g.mulligan >= 2) : allGames.filter((g) => g.mulligan === n);
    return {
      label: n === 0 ? "Sem mulligan" : n === 1 ? "1 mulligan" : "2+ mulligans",
      total: list.length, winRate: mullWinRate(list),
    };
  });
  const mullOnPlay = allGames.filter((g) => g.mulligan > 0 && g.playDraw === "play");
  const mullOnDraw = allGames.filter((g) => g.mulligan > 0 && g.playDraw === "draw");
  const mullByPlayDraw = {
    play: { total: mullOnPlay.length, winRate: mullWinRate(mullOnPlay) },
    draw: { total: mullOnDraw.length, winRate: mullWinRate(mullOnDraw) },
  };

  const lostG1 = matches.filter((m) => m.games && m.games[0] && m.games[0].resultado === "derrota");
  const comebackRate = lostG1.length ? Math.round((lostG1.filter((m) => m.resultado === "vitoria").length / lostG1.length) * 100) : 0;
  const wonG1 = matches.filter((m) => m.games && m.games[0] && m.games[0].resultado === "vitoria");
  const chokeRate = wonG1.length ? Math.round((wonG1LostMatch.length / wonG1.length) * 100) : 0;

  const sorted = [...matches].sort((a, b) => a.data.localeCompare(b.data));
  let curStreak = 0, curType = null, bestWinStreak = 0, bestLossStreak = 0;
  sorted.forEach((m) => {
    if (m.resultado === curType) { curStreak += 1; } else { curType = m.resultado; curStreak = 1; }
    if (curType === "vitoria") bestWinStreak = Math.max(bestWinStreak, curStreak);
    if (curType === "derrota") bestLossStreak = Math.max(bestLossStreak, curStreak);
  });

  const timelineMap = {};
  sorted.forEach((m) => {
    const wk = weekStartLabel(m.data);
    if (!timelineMap[wk]) timelineMap[wk] = { label: wk, total: 0, wins: 0, losses: 0 };
    timelineMap[wk].total += 1;
    if (m.resultado === "vitoria") timelineMap[wk].wins += 1;
    else if (m.resultado === "derrota") timelineMap[wk].losses += 1;
  });
  const winRateTimeline = Object.values(timelineMap).map((w) => ({ ...w, winRate: winPct(w.wins, w.total - w.wins - w.losses, w.total) }));

  const rodadaMap = {};
  matches.filter((m) => m.tipo === "torneio" && m.rodada).forEach((m) => {
    const r = m.rodada;
    rodadaMap[r] = rodadaMap[r] || { rodada: r, total: 0, wins: 0, losses: 0 };
    rodadaMap[r].total += 1;
    if (m.resultado === "vitoria") rodadaMap[r].wins += 1;
    else if (m.resultado === "derrota") rodadaMap[r].losses += 1;
  });
  const rodadaStats = Object.values(rodadaMap).map((r) => ({ ...r, winRate: winPct(r.wins, r.total - r.wins - r.losses, r.total) })).sort((a, b) => a.rodada - b.rodada);

  const torneiosMap = {};
  matches.filter((m) => m.tipo === "torneio").forEach((m) => {
    const key = m.torneioId || (m.local + "|" + m.data);
    if (!torneiosMap[key]) {
      torneiosMap[key] = { local: m.local, data: m.data, colocacao: m.colocacao, meuDeck: m.meuDeck };
    } else {
      if (m.data < torneiosMap[key].data) torneiosMap[key].data = m.data;
      if (!torneiosMap[key].colocacao && m.colocacao) torneiosMap[key].colocacao = m.colocacao;
    }
  });
  const torneiosList = Object.values(torneiosMap);

  const colocacaoPorDeckMap = {};
  torneiosList.filter((t) => t.colocacao && t.colocacao.trim()).forEach((t) => {
    colocacaoPorDeckMap[t.meuDeck] = colocacaoPorDeckMap[t.meuDeck] || [];
    colocacaoPorDeckMap[t.meuDeck].push(t.colocacao.trim());
  });
  const colocacaoPorDeck = Object.entries(colocacaoPorDeckMap).map(([deck, colocacoes]) => ({ deck, colocacoes }));

  const byDeck = {};
  matches.forEach((m) => {
    byDeck[m.meuDeck] = byDeck[m.meuDeck] || { total: 0, wins: 0, losses: 0 };
    byDeck[m.meuDeck].total += 1;
    if (m.resultado === "vitoria") byDeck[m.meuDeck].wins += 1;
    else if (m.resultado === "derrota") byDeck[m.meuDeck].losses += 1;
  });
  const deckStats = Object.entries(byDeck).map(([deck, v]) => ({ deck, total: v.total, wins: v.wins, winRate: winPct(v.wins, v.total - v.wins - v.losses, v.total) }));

  const matrixMap = {};
  matches.filter((m) => !m.isBye).forEach((m) => {
    const key = m.meuDeck + "|" + m.oponenteDeck;
    matrixMap[key] = matrixMap[key] || { meuDeck: m.meuDeck, oponenteDeck: m.oponenteDeck, total: 0, wins: 0, losses: 0 };
    matrixMap[key].total += 1;
    if (m.resultado === "vitoria") matrixMap[key].wins += 1;
    else if (m.resultado === "derrota") matrixMap[key].losses += 1;
  });
  const deckMatchupMatrix = Object.values(matrixMap).map((v) => ({ ...v, winRate: winPct(v.wins, v.total - v.wins - v.losses, v.total) })).sort((a, b) => b.total - a.total);

  const tagCounts = {};
  matches.filter((m) => m.resultado === "derrota" && m.tagsDerrota && m.tagsDerrota.length > 0).forEach((m) => {
    m.tagsDerrota.forEach((tag) => { tagCounts[tag] = (tagCounts[tag] || 0) + 1; });
  });
  const lossTagStats = Object.entries(tagCounts)
    .map(([tag, count]) => ({ tag, count, percent: totalLosses ? Math.round((count / totalLosses) * 100) : 0 }))
    .sort((a, b) => b.count - a.count);

  return {
    matches, total, wins, losses, draws: total - wins - losses, byeCount, winRate, torneio, treino, play, draw,
    matchupStats, bestMatchup, worstMatchups, mirrorMatches, mirrorWins, wonG1LostMatch,
    lossNotes, lossesWithMulligan, totalLosses,
    mullWinRateWith: mullWinRate(gamesWithMulligan), mullWinRateWithout: mullWinRate(gamesNoMulligan),
    mullByCount, mullByPlayDraw, comebackRate, chokeRate, lostG1Total: lostG1.length, wonG1Total: wonG1.length,
    bestWinStreak, bestLossStreak, torneios: torneiosList, deckStats,
    winRateTimeline, rodadaStats, colocacaoPorDeck, deckMatchupMatrix, lossTagStats,
  };
}

function computeMonthlyReport(allMatches, monthKeyStr) {
  const matches = allMatches.filter((m) => monthKey(m.data) === monthKeyStr);
  const prevMatches = allMatches.filter((m) => monthKey(m.data) === prevMonthKey(monthKeyStr));
  const prevWinRate = prevMatches.length ? Math.round((prevMatches.filter((m) => m.resultado === "vitoria").length / prevMatches.length) * 100) : null;
  return { ...computeReportStats(matches), prevWinRate };
}

function computeRangeReport(allMatches, start, end) {
  const matches = allMatches.filter((m) => m.data >= start && m.data <= end);
  return { ...computeReportStats(matches), prevWinRate: null };
}

function generateReportNarrative(r, periodLabel) {
  if (r.total === 0) return `Nenhuma partida registrada em ${periodLabel} ainda.`;
  const parts = [];

  let opening = `${periodLabel.charAt(0).toUpperCase() + periodLabel.slice(1)} fechou com ${r.winRate}% de vitórias (${r.wins}V/${r.losses}D em ${r.total} partida${r.total !== 1 ? "s" : ""})`;
  if (r.prevWinRate !== null) {
    const delta = r.winRate - r.prevWinRate;
    if (delta > 5) opening += `, uma alta de ${delta} pontos em relação ao mês anterior. Boa evolução.`;
    else if (delta < -5) opening += `, uma queda de ${Math.abs(delta)} pontos em relação ao mês anterior.`;
    else opening += `, estável em relação ao mês anterior.`;
  } else {
    opening += ".";
  }
  parts.push(opening);

  if (r.bestMatchup) {
    parts.push(`O destaque do período foi contra ${r.bestMatchup.opp} — você dominou esse matchup com ${r.bestMatchup.winRate}% de vitórias.`);
  }
  if (r.bestWinStreak >= 3) {
    parts.push(`Também vale comemorar a sequência de ${r.bestWinStreak} vitórias seguidas.`);
  }

  if (r.worstMatchups.length > 0) {
    const w = r.worstMatchups[0];
    let attention = `O ponto que mais chama atenção é o matchup contra ${w.opp}: foram ${w.total} confronto${w.total !== 1 ? "s" : ""}, com apenas ${w.wins} vitória${w.wins !== 1 ? "s" : ""}.`;
    const wonG1LostThisOpp = r.wonG1LostMatch.filter((m) => m.oponenteDeck === w.opp).length;
    if (wonG1LostThisOpp > 0) {
      attention += ` Em ${wonG1LostThisOpp} dessas derrotas, você venceu o G1 e ainda assim perdeu a partida — um sinal forte de que o plano de sideboard nesse matchup precisa de revisão.`;
    }
    parts.push(attention);
  }
  if (r.mirrorMatches.length >= 2 && r.mirrorMatches.length - r.mirrorWins > r.mirrorWins) {
    parts.push(`O mirror match também pesou: foram ${r.mirrorMatches.length} jogados, com só ${r.mirrorWins} vitória${r.mirrorWins !== 1 ? "s" : ""}.`);
  }
  if (r.lossNotes.length > 0) {
    parts.push(`Suas próprias anotações do período reforçam alguns desses pontos — vale reler antes do próximo torneio.`);
  }

  if (r.torneio.total > 0 && r.treino.total > 0) {
    if (r.torneio.winRate > r.treino.winRate + 5) {
      parts.push(`Torneios foram mais fortes que os treinos esse mês (${r.torneio.winRate}% vs ${r.treino.winRate}%) — parece que a pressão competitiva está puxando o seu melhor jogo.`);
    } else if (r.treino.winRate > r.torneio.winRate + 5) {
      parts.push(`Os treinos renderam mais que os torneios esse mês (${r.treino.winRate}% vs ${r.torneio.winRate}%) — pode valer entender o que muda na hora de valer pontos.`);
    }
  }

  return parts.join(" ");
}

function computePlayerFeedback(r) {
  const positives = [];
  const negatives = [];
  if (!r || r.total === 0) return { positives, negatives };

  if (r.total >= 3 && r.winRate >= 55) positives.push(`Win rate geral sólido: ${r.winRate}% (${r.wins}V/${r.losses}D).`);
  if (r.total >= 3 && r.winRate <= 40) negatives.push(`Win rate geral baixo: ${r.winRate}% (${r.wins}V/${r.losses}D).`);

  if (r.bestWinStreak >= 3) positives.push(`Sequência de ${r.bestWinStreak} vitórias seguidas no período.`);
  if (r.bestLossStreak >= 3) negatives.push(`Sequência de ${r.bestLossStreak} derrotas seguidas no período.`);

  const bestOk = r.matchupStats.find((m) => m.total >= 3 && m.winRate >= 65);
  if (bestOk) positives.push(`Domina o matchup contra ${bestOk.opp}: ${bestOk.winRate}% (${bestOk.wins}/${bestOk.total}).`);
  const worstOk = [...r.matchupStats].filter((m) => m.total >= 3).sort((a, b) => a.winRate - b.winRate)[0];
  if (worstOk && worstOk.winRate <= 35) negatives.push(`Dificuldade contra ${worstOk.opp}: ${worstOk.winRate}% (${worstOk.wins}/${worstOk.total}).`);

  if (r.lostG1Total >= 2 && r.comebackRate >= 40) positives.push(`Boa capacidade de virar: ${r.comebackRate}% de comeback depois de perder o Jogo 1.`);
  if (r.wonG1Total >= 2 && r.chokeRate >= 40) negatives.push(`Choke rate alto: ${r.chokeRate}% das vezes que ganhou o Jogo 1 acabou perdendo a partida.`);

  const postBoardGood = r.matchupStats.find((m) => m.total >= 3 && m.g1WinRate !== null && m.postBoardWinRate !== null && m.postBoardWinRate - m.g1WinRate >= 15);
  if (postBoardGood) positives.push(`Sideboard funcionando contra ${postBoardGood.opp}: pós-board ${postBoardGood.postBoardWinRate}% vs. ${postBoardGood.g1WinRate}% no Jogo 1.`);
  const postBoardBad = r.matchupStats.find((m) => m.total >= 3 && m.g1WinRate !== null && m.postBoardWinRate !== null && m.g1WinRate - m.postBoardWinRate >= 15);
  if (postBoardBad) negatives.push(`Sideboard não ajudando contra ${postBoardBad.opp}: cai pra ${postBoardBad.postBoardWinRate}% pós-board (Jogo 1 era ${postBoardBad.g1WinRate}%).`);

  const mull2 = r.mullByCount.find((m) => m.label === "2+ mulligans");
  if (mull2 && mull2.total >= 3 && mull2.winRate <= 30) negatives.push(`Jogos com 2+ mulligans renderam só ${mull2.winRate}% de vitórias (${mull2.total} jogos).`);
  const mull0 = r.mullByCount.find((m) => m.label === "Sem mulligan");
  if (mull0 && mull0.total >= 5 && mull0.winRate >= 65) positives.push(`Forte sem precisar de mulligan: ${mull0.winRate}% de vitórias (${mull0.total} jogos).`);

  if (r.lossTagStats.length > 0 && r.lossTagStats[0].percent >= 30 && r.totalLosses >= 3) {
    negatives.push(`Motivo de derrota mais comum: ${r.lossTagStats[0].tag} (${r.lossTagStats[0].percent}% das derrotas).`);
  }

  if (r.rodadaStats.length >= 3) {
    const half = Math.ceil(r.rodadaStats.length / 2);
    const early = r.rodadaStats.slice(0, half);
    const late = r.rodadaStats.slice(half);
    const earlyTotal = early.reduce((s, x) => s + x.total, 0);
    const lateTotal = late.reduce((s, x) => s + x.total, 0);
    if (earlyTotal >= 2 && lateTotal >= 2) {
      const earlyWR = Math.round((early.reduce((s, x) => s + x.wins, 0) / earlyTotal) * 100);
      const lateWR = Math.round((late.reduce((s, x) => s + x.wins, 0) / lateTotal) * 100);
      if (lateWR - earlyWR >= 15) positives.push(`Melhora nas rodadas finais dos torneios: ${lateWR}% vs. ${earlyWR}% nas rodadas iniciais.`);
      if (earlyWR - lateWR >= 15) negatives.push(`Queda de rendimento nas rodadas finais dos torneios: ${lateWR}% vs. ${earlyWR}% nas rodadas iniciais.`);
    }
  }

  return { positives, negatives };
}

function useFirebaseReady() {
  const [ready, setReady] = useState(!!window.__fbReady);
  useEffect(() => {
    if (window.__fbReady) return;
    const handler = () => setReady(true);
    window.addEventListener("firebase-ready", handler);
    return () => window.removeEventListener("firebase-ready", handler);
  }, []);
  return ready;
}

function useInstallPrompt() {
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [isStandalone, setIsStandalone] = useState(false);
  const [isIOS, setIsIOS] = useState(false);
  const [dismissed, setDismissed] = useState(false);

  useEffect(() => {
    const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    setIsStandalone(standalone);
    setIsIOS(/iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase()));
    try {
      setDismissed(localStorage.getItem("installBannerDismissed") === "true");
    } catch (e) {}

    function handler(e) {
      e.preventDefault();
      setDeferredPrompt(e);
    }
    window.addEventListener("beforeinstallprompt", handler);
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);

  function dismiss() {
    setDismissed(true);
    try { localStorage.setItem("installBannerDismissed", "true"); } catch (e) {}
  }

  async function install() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    setDeferredPrompt(null);
  }

  return {
    showAndroidBanner: !!deferredPrompt && !isStandalone && !dismissed,
    showIOSBanner: isIOS && !isStandalone && !dismissed,
    install,
    dismiss,
  };
}

function App() {
  const fbReady = useFirebaseReady();
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [authError, setAuthError] = useState("");
  const [team, setTeam] = useState(null);
  const [userTeams, setUserTeams] = useState([]);
  const [teamLoading, setTeamLoading] = useState(true);
  const [forceTeamGate, setForceTeamGate] = useState(false);
  const installPrompt = useInstallPrompt();

  useEffect(() => {
    if (!fbReady) return;
    const { auth, onAuthStateChanged } = window.__fb;
    const unsub = onAuthStateChanged(auth, (u) => {
      setUser(u);
      setAuthLoading(false);
    });
    return unsub;
  }, [fbReady]);

  useEffect(() => {
    if (!user) { setTeamLoading(false); return; }
    setTeamLoading(true);
    loadUserTeamsInfo(user.uid)
      .then(({ teams, activeTeamId }) => {
        setUserTeams(teams);
        const active = teams.find((t) => t.teamId === activeTeamId) || teams[0] || null;
        setTeam(active);
      })
      .catch(() => { setUserTeams([]); setTeam(null); })
      .finally(() => setTeamLoading(false));
  }, [user]);

  function handleTeamReady(t) {
    setUserTeams((prev) => (prev.some((x) => x.teamId === t.teamId) ? prev : [...prev, t]));
    setTeam(t);
    setForceTeamGate(false);
  }

  async function handleSwitchTeam(t) {
    setTeam(t);
    setForceTeamGate(false);
    try { await setActiveTeam(user.uid, t.teamId); } catch (e) {}
  }

  async function handleSignIn() {
    setAuthError("");
    try {
      await window.__fb.signInWithPopup(window.__fb.auth, window.__fb.provider);
    } catch (e) {
      setAuthError("Não consegui entrar: " + (e && e.message ? e.message : "erro desconhecido"));
    }
  }
  async function handleSignOut() {
    await window.__fb.signOut(window.__fb.auth);
  }

  const banner = installPrompt.showAndroidBanner ? (
    <InstallBanner variant="android" onInstall={installPrompt.install} onDismiss={installPrompt.dismiss} />
  ) : installPrompt.showIOSBanner ? (
    <InstallBanner variant="ios" onDismiss={installPrompt.dismiss} />
  ) : null;

  if (!fbReady || authLoading) {
    return <div style={{ padding: 24, color: "#6E6656" }}>Carregando…</div>;
  }
  if (!user) {
    return (
      <>
        {banner}
        <LoginScreen onSignIn={handleSignIn} errorMsg={authError} />
      </>
    );
  }
  if (teamLoading) {
    return <div style={{ padding: 24, color: "#6E6656" }}>Carregando…</div>;
  }
  if (!team || forceTeamGate) {
    return (
      <>
        {banner}
        <TeamGate
          user={user}
          onSignOut={handleSignOut}
          onTeamReady={handleTeamReady}
          existingTeams={userTeams}
          onSelectExisting={handleSwitchTeam}
          onCancel={team ? () => setForceTeamGate(false) : null}
        />
      </>
    );
  }
  return (
    <>
      {banner}
      <PauperTracker
        user={user}
        team={team}
        userTeams={userTeams}
        onSignOut={handleSignOut}
        onSwitchTeam={handleSwitchTeam}
        onRequestTeamGate={() => setForceTeamGate(true)}
      />
    </>
  );
}

  const [mode, setMode] = useState("choose"); // choose | create | join

  const [error, setError] = useState("");

    const name = teamName.trim();
    if (!name) { setError("Digita um nome pro time."); return; }
    setError("");
    setLoading(true);
    try {
      const { teamId, inviteCode } = await createTeam(user.uid, name, user.displayName || user.email);
      onTeamReady({ teamId, name, inviteCode });
    } catch (e) {
      setError("Não consegui criar o time: " + (e && e.message ? e.message : "erro"));
    } finally {
      setLoading(false);
    }
  }

  async function handleJoin() {
    if (!code.trim()) { setError("Digita o código do time."); return; }
    setError("");
    setLoading(true);
    try {
      const result = await joinTeamByCode(user.uid, code, user.displayName || user.email);
      onTeamReady(result);

      setError(e && e.message ? e.message : "Não consegui entrar no time.");

        <div style={{ display: "flex", flexDirection: "column", gap: 10, width: "100%", maxWidth: 300 }}>

            Criar um time novo

          </button>
          {onCancel && (
            <button onClick={onCancel} style={{ background: "transparent", border: "none", color: "#6E6656", fontSize: 13, cursor: "pointer", marginTop: 4 }}>
              Cancelar
            </button>
          )}
        </div>
      )}

      {mode === "create" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10, width: "100%", maxWidth: 300 }}>
          <input

          />
          <button onClick={handleCreate} disabled={loading} style={{ padding: "14px", borderRadius: 8, border: "none", background: "#2A2621", color: "#EFE9D8", fontWeight: 700, fontSize: 14, cursor: "pointer", opacity: loading ? 0.7 : 1 }}>

      )}

      {mode === "join" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10, width: "100%", maxWidth: 300 }}>
          <input
            value={code}

          />

            {loading ? "Entrando…" : "Entrar no time"}

  async function handleShareMyStats() {
    if (!myStatsCaptureRef.current || !window.html2canvas) return;
    setShareGenerating(true);
    try {
      const canvas = await window.html2canvas(myStatsCaptureRef.current, {
        backgroundColor: "#EFE9D8",
        scale: 2,
        useCORS: true,
      });
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      const fileName = `minhas-estatisticas-${(user.displayName || "jogador").replace(/\s+/g, "-").toLowerCase()}.png`;
      const file = new File([blob], fileName, { type: "image/png" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: "Minhas estatísticas",
          text: `Minhas estatísticas no Playbook (${team.name})`,
        });
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
    } catch (e) {
      if (e && e.name !== "AbortError") {
        setError("Não consegui compartilhar: " + (e && e.message ? e.message : "erro"));
      }
    } finally {
      setShareGenerating(false);
    }
  }

  function getMonthGrid(year, month) {
    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push(`${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
    }
    return cells;
  }
  function monthLabelFull(year, month) {
    const names = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    return `${names[month]} ${year}`;
  }

  function dayBackgroundStyle(cats) {
    const colors = Array.from(new Set(cats.map((c) => (EVENT_CATEGORIAS[c] || {}).color).filter(Boolean)));
    if (colors.length === 0) return {};
    if (colors.length === 1) return { background: colors[0] };
    const slice = 100 / colors.length;
    const stops = colors.map((c, i) => `${c} ${i * slice}% ${(i + 1) * slice}%`).join(", ");
    return { background: `conic-gradient(${stops})` };
  }

  function getMaxClmEtapa(clmStages, loja, excludeTorneioId) {
    const lojaStages = (clmStages && clmStages[loja]) || {};
    let max = 0;
    Object.entries(lojaStages).forEach(([etapa, info]) => {
      if (excludeTorneioId && info && info.torneioId === excludeTorneioId) return;
      const n = parseInt(etapa, 10);
      if (n > max) max = n;
    });
    return max;
  }
  // Marca a etapa escolhida como "jogado" e preenche automaticamente de falta as etapas puladas.
  function buildClmStagesUpdate(clmStages, loja, etapa, torneioId, excludeTorneioId) {
    const lojaStages = { ...((clmStages && clmStages[loja]) || {}) };
    if (excludeTorneioId) {
      Object.keys(lojaStages).forEach((k) => {
        if (lojaStages[k] && lojaStages[k].torneioId === excludeTorneioId) delete lojaStages[k];
      });
    }
    const maxAntes = getMaxClmEtapa({ [loja]: lojaStages }, loja);
    for (let e = maxAntes + 1; e < etapa; e++) {
      lojaStages[e] = { status: "falta", torneioId };
    }
    lojaStages[etapa] = { status: "jogado", torneioId };
    return { ...clmStages, [loja]: lojaStages };
  }

  function buildDeckPool(deckList, mode, oponenteName) {
    let main = deckList.mainboard.map((c) => ({ ...c }));
    if (mode === "g2" && oponenteName) {
      const sbEntry = sideboards.find((s) => s.formato === deckList.formato && s.deck === deckList.deck && s.oponente === oponenteName);
      if (sbEntry) {
        sbEntry.tirar.forEach((t) => {
          let toRemove = t.qtd;
          main = main.map((c) => {
            if (toRemove > 0 && c.name.toLowerCase() === t.carta.trim().toLowerCase() && c.qty > 0) {
              const remove = Math.min(toRemove, c.qty);
              toRemove -= remove;
              return { ...c, qty: c.qty - remove };
            }
            return c;
          }).filter((c) => c.qty > 0);
        });
        sbEntry.colocar.forEach((cIn) => {
          const fromSb = deckList.sideboardCards.find((s) => s.name.toLowerCase() === cIn.carta.trim().toLowerCase());
          const fromMain = deckList.mainboard.find((s) => s.name.toLowerCase() === cIn.carta.trim().toLowerCase());
          const imageUrl = fromSb ? fromSb.imageUrl : (fromMain ? fromMain.imageUrl : null);
          main.push({ name: cIn.carta.trim(), qty: cIn.qtd, imageUrl });
        });
      }
    }
    return expandCardList(main);
  }

    const lines = [];
    lines.push(`SIDEBOARD — ${deckName}`);

    lines.push("");
    entries.forEach((e) => {
      lines.push(`VS ${e.oponente.toUpperCase()}`);
      lines.push(`Tirar: ${e.tirar.length ? formatCardList(e.tirar) : "-"}`);
      lines.push(`Colocar: ${e.colocar.length ? formatCardList(e.colocar) : "-"}`);
      lines.push("");
    });
    const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;

  async function handleSave() {
    setError("");
    setSaving(true);
    const outcome = form.isBye ? { outcome: "vitoria", score: "Bye" } : matchOutcome(form.games);

    if (!form.formato) {
      setSaving(false); setError("Escolhe o formato da partida."); return;
    }
    if (!form.meuDeck.trim()) {
      setSaving(false); setError("Preenche pelo menos seu deck."); return;
    }
    if (!form.isBye) {
      if (!form.oponenteDeck.trim()) {
        setSaving(false); setError("Preenche o deck do oponente (ou marca Bye se não teve oponente)."); return;
      }
      if (!form.games[0].resultado) {
        setSaving(false); setError("Registra o resultado do Jogo 1."); return;
      }
      if (form.games[0].resultado !== "empate" && !form.games[1].resultado) {
        setSaving(false); setError("Registra o resultado do Jogo 2 (ou marca o Jogo 1 como empate se a rodada acabou ali)."); return;
      }
      if (needsGame3(form.games) && (form.games.length < 3 || !form.games[2].resultado)) {
        setSaving(false); setError("A partida está 1-1, registra o resultado do Jogo 3."); return;
      }
    }

    // Torneio: decide se essa partida continua o torneio ativo ou inicia um novo.
    let torneioId = form.torneioId || "";
    let rodadaToSave = form.rodada;
    let localToSave = form.local;
    let dataToSave = form.data;
    let novoTorneioObj = null;
    const temTorneioAtivo = data.activeTournament && !data.activeTournament.dropped;

    if (form.tipo === "torneio" && !editingId) {
      if (temTorneioAtivo) {
        torneioId = data.activeTournament.id;
        rodadaToSave = data.activeTournament.roundsPlayed + 1;
        localToSave = data.activeTournament.local;
        dataToSave = data.activeTournament.data || form.data;
      } else {
        if (!form.local.trim()) {
          setSaving(false); setError("Preenche a loja / evento do torneio."); return;
        }
        if (!novoTorneioRodadas) {
          setSaving(false); setError("Escolhe quantas rodadas tem o torneio."); return;
        }
        if (novoTorneioIsClm) {
          if (!novoTorneioClmEtapa) {
            setSaving(false); setError("Escolhe qual etapa do CLM é essa."); return;
          }
          const maxAtual = getMaxClmEtapa(data.clmStages, form.local.trim());
          if (novoTorneioClmEtapa <= maxAtual) {
            setSaving(false); setError(`Você já registrou até a etapa ${maxAtual} do CLM nessa loja. Escolhe uma etapa maior.`); return;
          }
        }
        torneioId = uid();
        rodadaToSave = 1;
        localToSave = form.local.trim();
        dataToSave = form.data;
        novoTorneioObj = {
          id: torneioId, local: localToSave, data: dataToSave, formato: form.formato, totalRounds: novoTorneioRodadas, roundsPlayed: 0, dropped: false,
          isClmEtapa: !!novoTorneioIsClm, clmEtapa: novoTorneioIsClm ? novoTorneioClmEtapa : null,
        };
      }
    }

    try {
      const matchPayload = {
        id: editingId || uid(), formato: form.formato, meuDeck: form.meuDeck.trim(), oponenteDeck: form.isBye ? "Bye" : form.oponenteDeck.trim(),
        games: form.isBye ? [] : form.games, resultado: outcome.outcome, score: outcome.score, isBye: !!form.isBye,
        tipo: form.tipo, local: form.tipo === "torneio" ? localToSave : form.local, data: form.tipo === "torneio" ? dataToSave : form.data,
        rodada: form.tipo === "torneio" ? rodadaToSave : "",
        torneioId: form.tipo === "torneio" ? torneioId : "",
        isClmEtapa: form.tipo === "torneio" ? !!(novoTorneioObj || data.activeTournament || {}).isClmEtapa : false,
        clmEtapa: form.tipo === "torneio" ? (novoTorneioObj || data.activeTournament || {}).clmEtapa || null : null,
        colocacao: form.colocacao, nota: form.nota,
        tagsDerrota: outcome.outcome === "derrota" ? form.tagsDerrota : [],
      };
      const nextMatches = editingId
        ? data.matches.map((m) => (m.id === editingId ? matchPayload : m))
        : [...data.matches, matchPayload];

      const ok = await persistMatches(nextMatches);
      setData((prev) => ({ ...prev, matches: nextMatches }));
      syncAllMatchesForAdmin(team.teamId, user.uid, user.displayName || user.email, nextMatches).catch(() => {});
      if (visible) {
        syncPlayerVisibility(team.teamId, user.uid, user.displayName || user.email, true, nextMatches).catch(() => {});
      }
      if (ok) {
        if (form.tipo === "torneio" && !editingId) {
          const baseTournament = novoTorneioObj || data.activeTournament;
          if (novoTorneioObj && novoTorneioObj.isClmEtapa) {
            const nextClmStages = buildClmStagesUpdate(data.clmStages, novoTorneioObj.local, novoTorneioObj.clmEtapa, novoTorneioObj.id);
            persistClmStages(nextClmStages).catch(() => {});
          }
          const updatedRounds = baseTournament.roundsPlayed + 1;
          if (updatedRounds >= baseTournament.totalRounds) {
            await persistActiveTournament(null);
            setData((prev) => ({ ...prev, activeTournament: null }));
          } else {
            const nextTournament = { ...baseTournament, roundsPlayed: updatedRounds };
            await persistActiveTournament(nextTournament);
            setData((prev) => ({ ...prev, activeTournament: nextTournament }));
          }
          setNovoTorneioRodadas(null);
          setNovoTorneioIsClm(false);
          setNovoTorneioClmEtapa(null);
        }
        if (editingId) {
          setEditingId(null); setForm(emptyForm()); setScreen("estatisticas");
        } else {
          setForm({ ...emptyForm(), formato: matchPayload.formato, meuDeck: matchPayload.meuDeck, tipo: matchPayload.tipo, local: matchPayload.tipo === "torneio" ? "" : matchPayload.local });
        }
        setSavedFlash(true);
        setTimeout(() => setSavedFlash(false), 2200);
      }
    } catch (e) {
      setError("Algo deu errado ao salvar: " + (e && e.message ? e.message : "erro desconhecido"));
    } finally {
      setSaving(false);
    }
  }

  const deckOptionsForForm = data.decks.filter((d) => d.formato === form.formato).map((d) => d.name);
  const meuDeckOptions = useMemo(() => {
    return [...deckOptionsForForm].sort((a, b) => {
      const aOwned = ownedDecks.includes(deckKey(form.formato, a)) ? 0 : 1;
      const bOwned = ownedDecks.includes(deckKey(form.formato, b)) ? 0 : 1;

function DeckSearchSelect({ value, onChange, options, placeholder = "Digite pra buscar..." }) {
  const [query, setQuery] = useState(value || "");
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => { setQuery(value || ""); }, [value]);

  useEffect(() => {
    if (!open) return;
    function handleClickOutside(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) {
        setOpen(false);
        setQuery(value || "");
      }
    }
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, [open, value]);

  const filtered = options.filter((opt) => opt.name.toLowerCase().includes(query.toLowerCase()));

  function selectOption(opt) {
    onChange(opt.name);
    setQuery(opt.name);
    setOpen(false);
  }

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <input
        value={query}
        onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        placeholder={placeholder}
        style={inputStyle}
      />
      {open && filtered.length > 0 && (
        <div style={{
          position: "absolute", zIndex: 60, top: "calc(100% + 4px)", left: 0, right: 0,
          background: "#F6F1E1", border: "1px solid #C9C0A6", borderRadius: 8,
          maxHeight: 220, overflowY: "auto", boxShadow: "0 6px 18px rgba(42,38,33,0.2)",
        }}>
          {filtered.map((opt) => (
            <div
              key={opt.name}
              onMouseDown={() => selectOption(opt)}
              style={{ padding: "10px 12px", cursor: "pointer", fontSize: 14, borderBottom: "1px solid #E4DBC0" }}
            >
              {opt.starred ? `★ ${opt.name}` : opt.name}
            </div>
          ))}
        </div>
      )}
      {open && query && filtered.length === 0 && (
        <div style={{
          position: "absolute", zIndex: 60, top: "calc(100% + 4px)", left: 0, right: 0,
          background: "#F6F1E1", border: "1px solid #C9C0A6", borderRadius: 8,
          padding: "10px 12px", fontSize: 13, color: "#8A8270",
        }}>
          Nenhum deck encontrado
        </div>
      )}
    </div>
  );
}

  function openPicker() {
    const rect = btnRef.current.getBoundingClientRect();
    setCoords({ left: rect.left, top: rect.bottom + 6, width: rect.width });

  }

  useEffect(() => {

      if (popRef.current && !popRef.current.contains(e.target) && btnRef.current && !btnRef.current.contains(e.target)) {

    document.addEventListener("mousedown", handleClickOutside);
    window.addEventListener("scroll", handleScrollOrResize, true);
    window.addEventListener("resize", handleScrollOrResize);
    return () => {
      document.removeEventListener("mousedown", handleClickOutside);

          ))}
        </div>
      )}
    </>
  );
}

function DatePicker({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const [coords, setCoords] = useState(null);
  const btnRef = useRef(null);
  const popRef = useRef(null);
  const initial = value ? new Date(value + "T00:00:00") : new Date();
  const [viewYear, setViewYear] = useState(initial.getFullYear());
  const [viewMonth, setViewMonth] = useState(initial.getMonth());

  function openPicker() {
    const rect = btnRef.current.getBoundingClientRect();
    const popH = 300;
    const spaceBelow = window.innerHeight - rect.bottom;
    const openUpward = spaceBelow < popH && rect.top > popH;
    setCoords({
      left: Math.min(rect.left, window.innerWidth - 268),
      top: openUpward ? rect.top - popH - 6 : rect.bottom + 6,
      width: rect.width,
    });
    setOpen(true);
  }

  useEffect(() => {
    if (!open) return;
    function handleClickOutside(e) {
      if (popRef.current && !popRef.current.contains(e.target) && btnRef.current && !btnRef.current.contains(e.target)) {
        setOpen(false);
      }
    }
    function handleScrollOrResize() { setOpen(false); }
    document.addEventListener("mousedown", handleClickOutside);
    window.addEventListener("scroll", handleScrollOrResize, true);
    window.addEventListener("resize", handleScrollOrResize);
    return () => {
      document.removeEventListener("mousedown", handleClickOutside);
      window.removeEventListener("scroll", handleScrollOrResize, true);
      window.removeEventListener("resize", handleScrollOrResize);
    };
  }, [open]);

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function isoFor(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
  function formatDisplay(iso) {
    if (!iso) return "Selecionar data";
    const [y, m, d] = iso.split("-");
    return `${d}/${m}/${y}`;
  }
  function changeMonth(delta) {
    let y = viewYear, m = viewMonth + delta;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    setViewYear(y); setViewMonth(m);
  }

  const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
  const weekDays = ["D", "S", "T", "Q", "Q", "S", "S"];
  const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
  const startWeekday = new Date(viewYear, viewMonth, 1).getDay();
  const todayIso = todayISO();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) cells.push(d);

  return (
    <div>
      <button
        type="button"
        ref={btnRef}
        onClick={() => (open ? setOpen(false) : openPicker())}
        style={{ ...inputStyle, textAlign: "left", cursor: "pointer", display: "block", width: "100%" }}
      >
        {formatDisplay(value)}
      </button>
      {open && coords && (
        <div
          ref={popRef}
          style={{
            position: "fixed", zIndex: 1000, top: coords.top, left: coords.left,
            background: "#F6F1E1", border: "1px solid #C9C0A6", borderRadius: 8,
            padding: 12, width: 260, boxShadow: "0 6px 18px rgba(42,38,33,0.25)",
          }}
        >
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <button type="button" onClick={() => changeMonth(-1)} style={{ border: "none", background: "transparent", fontSize: 18, cursor: "pointer", color: "#2A2621", fontWeight: 700, padding: "0 8px" }}>‹</button>
            <span style={{ fontFamily: "'Zilla Slab', serif", fontWeight: 700, fontSize: 14 }}>{monthNames[viewMonth]} {viewYear}</span>
            <button type="button" onClick={() => changeMonth(1)} style={{ border: "none", background: "transparent", fontSize: 18, cursor: "pointer", color: "#2A2621", fontWeight: 700, padding: "0 8px" }}>›</button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 4 }}>
            {weekDays.map((w, i) => (
              <div key={i} style={{ textAlign: "center", fontSize: 10, color: "#8A8270", fontWeight: 700 }}>{w}</div>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {cells.map((day, i) => {
              if (day === null) return <div key={i} />;
              const iso = isoFor(viewYear, viewMonth, day);
              const isSelected = iso === value;
              const isToday = iso === todayIso;
              return (
                <button
                  type="button"
                  key={i}
                  onClick={() => { onChange(iso); setOpen(false); }}
                  style={{
                    width: 32, height: 32, borderRadius: 6,
                    border: isToday && !isSelected ? "1px solid #B15C3E" : "1px solid transparent",
                    background: isSelected ? "#2A2621" : "transparent",
                    color: isSelected ? "#EFE9D8" : "#2A2621",
                    fontSize: 12, fontWeight: isSelected ? 700 : 500, cursor: "pointer",
                  }}
                >
                  {day}
                </button>
              );
            })}
          </div>
          <button
            type="button"
            onClick={() => { onChange(todayIso); setOpen(false); }}
            style={{ marginTop: 10, width: "100%", padding: "6px 0", borderRadius: 6, border: "1px solid #C9C0A6", background: "transparent", color: "#6E6656", fontSize: 12, fontWeight: 700, cursor: "pointer" }}
          >
            Hoje
          </button>
        </div>
      )}
    </div>
  );
}

            <span>{d.name}</span>
            <span style={{ fontWeight: 700 }}>
              {d.winRate}% ({d.total})
              {typeof d.wins === "number" && (
                <span style={{ fontWeight: 500, color: "#8A8270", fontSize: 11 }}> · conf: {Math.round(wilsonScore(effectiveWins(d.wins, d.total - d.wins - (d.losses || 0)), d.total) * 100)}%</span>
              )}
            </span>
          </div>
          <div style={{ background: "#E4DBC0", borderRadius: 4, height: 14, overflow: "hidden" }}>
            <div style={{ width: d.winRate + "%", height: "100%", background: barColor(d.winRate), borderRadius: 4 }} />
          </div>
        </div>
      ))}
    </div>
  );
}
function PieChartCustom({ data }) {
  let cumulative = 0;
  const stops = data.map((d) => {
    const start = cumulative;
    cumulative += d.percent;
    return `${barColor(d.winRate)} ${start}% ${cumulative}%`;
  }).join(", ");
  const gradient = data.length ? `conic-gradient(${stops})` : "#E4DBC0";
  return (
    <div style={{ display: "flex", gap: 18, alignItems: "center", flexWrap: "wrap" }}>
      <div style={{ width: 150, height: 150, borderRadius: "50%", background: gradient, flexShrink: 0 }} />
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {data.map((d, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}>
            <span style={{ width: 10, height: 10, borderRadius: 2, background: barColor(d.winRate), flexShrink: 0 }} />
            <span><strong>{d.name}</strong> · {d.percent}% das partidas · {d.winRate}% win rate</span>
          </div>
        ))}
      </div>
    </div>
  );
}
